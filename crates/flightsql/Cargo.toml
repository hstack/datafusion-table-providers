[package]
name = "datafusion-table-providers-flightsql"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion flight table provider"

[dependencies]
arrow-flight = { workspace = true, features = ["flight-sql-experimental", "tls-ring"] }
async-trait = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql", "serde"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-proto = { workspace = true }
datafusion-table-providers-common = { workspace = true }
futures = { workspace = true }
moka = { version = "0.12", features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tonic = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
